services:
  telegram-port:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TELEGRAM_PROXY_KEY: ${TELEGRAM_PROXY_KEY:?Set a random key of at least 32 characters}
    expose: ["3000"]
    networks: [dokploy-network]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  dokploy-network:
    external: true
